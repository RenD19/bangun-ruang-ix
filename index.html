<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bangun Ruang Sisi Lengkung</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Media belajar interaktif tabung, kerucut, dan bola untuk Kelas IX: tab Belajar dan Latihan Mandiri persiapan sumatif akhir semester.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <rect x="3" y="8" width="11" height="18" rx="1" fill="var(--tabung-soft)" stroke="var(--tabung)" stroke-width="2"/>
        <path d="M17 26 L22 8 L27 26 Z" fill="var(--kerucut-soft)" stroke="var(--kerucut)" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="27" cy="27" r="5" fill="var(--bola-soft)" stroke="var(--bola)" stroke-width="2"/>
      </svg>
      <div><b>Bangun Ruang Sisi Lengkung</b><small>Matematika Kelas IX · tabung, kerucut, bola</small></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Bagian media">
      <button class="tab" role="tab" data-tab="belajar" type="button" aria-selected="true">Belajar</button>
      <button class="tab" role="tab" data-tab="latihan" type="button" aria-selected="false">Latihan Mandiri</button>
    </nav>
  </div>
</header>
<main id="main"></main>
<script src="js/soal.js"></script>
<script src="js/gambar.js"></script>
<script src="js/app.js"></script>

</html>
